# Deploys the site to GitHub Pages on every push to main.
# Uses the official GitHub Pages Actions flow (artifact-based, no Jekyll).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow only one concurrent deployment; queue newer runs instead of cancelling.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 该视频 58.9MB，超过 GitHub REST API 的单文件处理上限，无法随仓库提交，
      # 因此在构建阶段从源站补齐（内容与原站完全一致）。若源站不可达则跳过，
      # 站点其余部分仍正常部署。
      - name: Fetch oversized asset (dior-glitter.mp4)
        run: |
          mkdir -p assets/works/video
          curl -sSL --retry 3 --max-time 600 \
            https://axie-portfolio.app.workbuddy.host/assets/works/video/dior-glitter.mp4 \
            -o assets/works/video/dior-glitter.mp4
          size=$(stat -c%s assets/works/video/dior-glitter.mp4 2>/dev/null || echo 0)
          echo "downloaded bytes: $size"
          if [ "$size" -lt 1000000 ]; then
            echo "下载不完整，移除该文件以免发布损坏资源"
            rm -f assets/works/video/dior-glitter.mp4
          fi
        continue-on-error: true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
